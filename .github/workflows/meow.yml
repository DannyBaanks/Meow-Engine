name: 🐱 MEOW CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 12 * * *'  # Daily at noon (cat feeding time)

permissions:
  contents: write

concurrency:
  group: meow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast unit tests - no external runtimes needed
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML
      - name: 🧪 Run unit tests
        run: |
          python -m pytest tests/test_protocol.py tests/test_frontier.py tests/test_cat.py tests/test_arena.py tests/test_cli.py tests/test_dataflow.py tests/test_provenance.py tests/test_roster.py tests/test_infinite_cat.py tests/test_interpreters.py::test_no_private_project_references -v --tb=short

  # Tests requiring external runtimes
  test-gladiators:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML
      - name: 🔧 Install external runtimes
        run: |
          sudo apt-get update && sudo apt-get install -y \
            nodejs npm \
            cargo \
            golang-go \
            openjdk-17-jdk \
            lua5.4 \
            tcl \
            racket \
            swi-prolog \
            sbcl \
            dotnet-sdk-8.0 \
            php \
            ruby \
            swift \
            jq
          # Rust already has cargo
      - name: 🧪 Run gladiator tests
        run: |
          python -m pytest tests/test_gladiator_brainfuck.py tests/test_gladiator_rust.py tests/test_interpreters.py -v --tb=short

  # Integration tests - full tournament flow
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML
      - name: 🧪 Run integration tests
        run: |
          python -m pytest tests/test_tournament.py tests/test_the_joke.py tests/test_the_cat_is_a_cat.py -v --tb=short

  # Judge/validation tests
  test-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML
      - name: 🧪 Run judge tests
        run: |
          python -m pytest tests/test_judge.py -v --tb=short

  # Generate cat and update README - runs after all tests pass
  generate-and-update:
    needs: [test-unit, test-gladiators, test-integration, test-judge]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyYAML
      - name: 🐱 Generate cat for README
        id: meow
        run: |
          python generate_cat.py
          cat cat.txt
          delimiter="MEOW_EOF_$(date +%s%N)"
          {
            echo "meow<<$delimiter"
            cat cat.txt
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: 📝 Update README with cat
        run: |
          python - <<'PYEOF'
          import os
          cat = open('cat.txt', 'r', encoding='utf-8').read()
          readme = '''# MEOW-ENGINE

          El gato más innecesariamente sobre-ingenierizado del mundo.

          > **¿Por qué?** Podíamos. · **¿Qué hace?** Hace un gato. · **¿40 lenguajes?** Sí.

              python meow.py --tournament

          ## La gracia

              python -m pytest tests/test_the_joke.py::test_the_whole_thing_was_unnecessary

          El coliseo entero produce exactamente lo mismo que JAJAJA solo.
          Todo el proyecto existe para demostrar que todo el proyecto era innecesario.

          ---

          ### Gatito del día 🐱

          ```
          {cat}
          ```

          *Actualizado automáticamente por CI • {date} UTC*

          ---

          ### 🧪 Experimento del gatito infinito

          El gato NO se elige: **se construye**. Cada corrida toma 64 bits reales
          de entropía (`secrets.randbits(64)`) y construye el gato pieza por pieza:
          8 partes independientes, y solo `byte == 0` produce la pieza canónica.

              P(gato verdadero) = (1/256)^8 = 1 / 2^64 ≈ 5.4e-20   por corrida

          Cuencas de fallo: `CAT` (8/8) · `DOG` (7/8, un solo fallo) ·
          `CUP` (<=1 hit, nada coincide) · `ABOMINATION` (el resto).

          Auditoría por corrida en `cat_log.jsonl`: fuente de entropía, roll_hex,
          bytes por parte, hits y verdict. Regla sagrada del repo:
          **THE CI MUST NEVER GUARANTEE THAT THE CAT WILL APPEAR.**

          ---

          ## En Honor a todos mis gatitas/os 🐱❤️
          '''.format(cat=cat, date=__import__('datetime').datetime.utcnow().strftime('%Y-%m-%d %H:%M'))
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(readme)
          print('README actualizado')
          PYEOF
      - name: 📤 Commit README + audit log if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git status --porcelain README.md cat_log.jsonl)
          if [ -n "$changed" ]; then
            verdict=$(tail -n1 cat_log.jsonl | python -c "import sys,json; print(json.load(sys.stdin)['verdict'])")
            git add README.md cat_log.jsonl
            git commit -m "🐱 Gatito del día $(date -u +'%Y-%m-%d') [$verdict]"
            git push
          fi

  # Lightweight daily job
  meow-only:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🐱 Daily meow
        run: |
          echo "🐱 Daily scheduled meow - keeping the repo purring"